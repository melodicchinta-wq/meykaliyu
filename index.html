<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Jigsaw & Math Arena ⚡</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    :root {
      --bg-dark: #0a050e;
      --card-bg: rgba(22, 11, 31, 0.7);
      --card-border: rgba(255, 0, 85, 0.25);
      --primary-gradient: linear-gradient(135deg, #ff0055 0%, #ff5000 100%);
      --accent-purple: #9d4edd;
      --accent-neon: #ff0055;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ff0055;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #060209;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    /* Container Glassmorphism */
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Glowing Blob Effect in Background */
    .container::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      background: var(--primary-gradient);
      filter: blur(90px);
      opacity: 0.35;
      z-index: -1;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 30%, #ff5000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .upload-btn-wrapper {
      margin-bottom: 16px;
    }

    .btn-upload {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      padding: 10px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
    }

    .btn-upload:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Modern Buttons */
    .btn {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 0, 85, 0.35);
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(255, 0, 85, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .screen { display: none; }
    .screen.active { 
      display: block; 
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Jigsaw Card Canvas Frame */
    .puzzle-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }

    #jigsaw-canvas {
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      touch-action: none;
      cursor: grab;
    }

    /* Cards / Glass Panels */
    .setting-card, .table-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: left;
    }

    .setting-card label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .setting-card select, .setting-card input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
      background: rgba(15, 7, 24, 0.8);
      color: #fff;
      transition: border-color 0.2s;
    }

    .setting-card select:focus, .setting-card input:focus {
      border-color: var(--accent-neon);
    }

    .range-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Quiz Screen Styles */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .progress-badge {
      background: rgba(255, 0, 85, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      color: #ff5079;
      border: 1px solid rgba(255, 0, 85, 0.3);
      font-size: 0.8rem;
    }

    .timer-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--primary-gradient);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
      transition: width 0.1s linear;
    }

    .question-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 12px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .question-text {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff, #ff7597);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .quiz-input {
      width: 100%;
      padding: 12px;
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      outline: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .quiz-input:focus {
      border-color: #ff0055;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
    }

    /* Results */
    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      border: 3px solid #ff0055;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin: 16px auto;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px rgba(255, 255, 255, 0.1) dashed;
      border-radius: 14px;
      padding: 12px;
      margin: 14px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .analysis-list {
      max-height: 170px;
      overflow-y: auto;
      text-align: left;
      margin: 12px 0;
      padding-right: 4px;
    }

    .analysis-item {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-left: 4px solid var(--text-muted);
    }

    .analysis-item.wrong { border-left-color: var(--wrong); }
    .analysis-item.correct { border-left-color: var(--correct); }

    /* Custom Table Style */
    .table-scroll { overflow-x: auto; border-radius: 10px; }
    table.m-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    table.m-table th, table.m-table td { padding: 6px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    table.m-table th { background: rgba(255,0,85,0.2); color: #fff; }
    table.m-table td { background: rgba(0,0,0,0.2); }

    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. HALAMAN PUZZLE -->
    <div id="welcome-screen" class="screen active">
      <div style="font-size: 2.2rem; margin-bottom: 2px;">🎮</div>
      <h1>Jigsaw Arena</h1>
      <p class="subtitle">Selesaikan puzzle untuk membuka arena!</p>

      <div class="upload-btn-wrapper">
        <label for="image-upload" class="btn-upload">📷 Unggah Foto Sendiri</label>
        <input type="file" id="image-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
      </div>

      <div class="puzzle-box">
        <canvas id="jigsaw-canvas" width="320" height="380"></canvas>
      </div>

      <button class="btn" onclick="goToTablePage()">Mulai Game ➔</button>
    </div>

    <!-- 2. HALAMAN PENGATURAN MODE MATH -->
    <div id="table-screen" class="screen">
      <div style="font-size: 2rem; margin-bottom: 4px;">⚡</div>
      <h1 id="page-title">Math Arena</h1>
      <p class="subtitle">Atur tingkat kesulitan tantanganmu</p>

      <div class="setting-card">
        <label for="op-select" id="op-label">Operasi Matematika</label>
        <select id="op-select" onchange="onOpChange()">
          <option value="multiplication" selected>Perkalian (×)</option>
          <option value="division">Pembagian (÷)</option>
        </select>

        <label for="mode-select">Mode Permainan</label>
        <select id="mode-select" onchange="toggleModeUI()">
          <option value="single">Angka Spesifik (2 Angka)</option>
          <option value="random" selected>Acak Standard (2 Angka)</option>
          <option value="complex">🔥 Campuran Kompleks (3 Angka)</option>
        </select>

        <div id="single-mode-ui" style="display: none;">
          <label id="specific-label" for="specific-num">Fokus Pada Angka</label>
          <select id="specific-num">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7" selected>7</option><option value="8">8</option><option value="9">9</option>
          </select>
        </div>

        <div id="random-mode-ui">
          <label>Rentang Angka Acak</label>
          <div class="range-group">
            <input type="number" id="min-num" value="3" min="1" max="12">
            <span style="font-size: 0.8rem; color: var(--text-muted);">s/d</span>
            <input type="number" id="max-num" value="9" min="1" max="12">
          </div>
        </div>
      </div>

      <div class="table-card" id="table-card-container">
        <h3 id="table-title" style="font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted);">Bagan Referensi 📚</h3>
        <div class="table-scroll">
          <table class="m-table" id="math-table"></table>
        </div>
      </div>

      <button class="btn" onclick="startQuiz()">Lanjut Ke Tantangan ⚡</button>
      <button class="btn btn-secondary" onclick="goToHome()">⬅️ Kembali ke Puzzle</button>
    </div>

    <!-- 3. HALAMAN QUIZ -->
    <div id="quiz-screen" class="screen">
      <div class="quiz-header">
        <span class="progress-badge" id="progress-text">Soal 1/10</span>
        <span id="timer-text" style="color: #ff5079; font-size: 0.9rem;">⏱️ 10s</span>
      </div>

      <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div class="question-box">
        <div class="question-text" id="question-display">7 × 7</div>
      </div>

      <form onsubmit="submitAnswer(event)">
        <input type="number" id="user-input" class="quiz-input" placeholder="?" autocomplete="off">
        <button type="submit" class="btn">Jawab ⚡</button>
      </form>
    </div>

    <!-- 4. RESULT SCREEN -->
    <div id="result-screen" class="screen">
      <div style="font-size: 2.2rem; margin-bottom: 2px;" id="result-emoji">🎉</div>
      <h1 id="result-title">Hasil Akhir</h1>
      
      <div class="score-circle" id="score-display">8/10</div>

      <div class="quote-box" id="quote-display">"Kerja bagus! Asah terus kecepatan otakmu!"</div>

      <p style="font-weight: 600; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem;">Analisis Jawaban 📝</p>
      
      <div class="analysis-list" id="analysis-container"></div>

      <button class="btn" onclick="startQuiz()">Coba Lagi 🔄</button>
      <button class="btn btn-secondary" onclick="goToTablePage()">Pengaturan 📊</button>
    </div>

  </div>

  <script>
    /* PUZZLE ENGINE */
    const canvas = document.getElementById('jigsaw-canvas');
    const ctx = canvas.getContext('2d');
    const COLS = 3, ROWS = 2, CANVAS_WIDTH = 320;
    let BOARD_X = 10, BOARD_Y = 10, BOARD_W = 300, BOARD_H = 200;
    let PIECE_W = BOARD_W / COLS, PIECE_H = BOARD_H / ROWS;

    let offscreenCanvas = document.createElement('canvas');
    let offscreenCtx = offscreenCanvas.getContext('2d');
    let pieces = [], selectedPiece = null, dragOffsetX = 0, dragOffsetY = 0;

    const edgesHorizontal = [[1, -1], [-1, 1]];
    const edgesVertical = [[1, -1, 1]];

    function createDefaultImage() {
      const imgCanvas = document.createElement('canvas');
      imgCanvas.width = 300; imgCanvas.height = 200;
      const oCtx = imgCanvas.getContext('2d');

      let grad = oCtx.createLinearGradient(0, 0, 300, 200);
      grad.addColorStop(0, '#ff0055');
      grad.addColorStop(1, '#7928ca');
      oCtx.fillStyle = grad;
      oCtx.fillRect(0, 0, 300, 200);

      oCtx.fillStyle = '#ffffff';
      oCtx.font = 'bold 32px Plus Jakarta Sans';
      oCtx.textAlign = 'center';
      oCtx.fillText('ARENA MATH', 150, 105);

      let img = new Image();
      img.src = imgCanvas.toDataURL();
      img.onload = () => setupPuzzleWithImage(img);
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() { setupPuzzleWithImage(img); };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setupPuzzleWithImage(img) {
      const MAX_W = 290, MAX_H = 340;
      let imgAspect = img.width / img.height, maxAspect = MAX_W / MAX_H;

      if (imgAspect > maxAspect) {
        BOARD_W = MAX_W; BOARD_H = Math.round(MAX_W / imgAspect);
      } else {
        BOARD_H = MAX_H; BOARD_W = Math.round(MAX_H * imgAspect);
      }

      BOARD_X = Math.round((CANVAS_WIDTH - BOARD_W) / 2);
      PIECE_W = BOARD_W / COLS; PIECE_H = BOARD_H / ROWS;

      canvas.width = CANVAS_WIDTH;
      canvas.height = BOARD_Y + BOARD_H + 150;

      offscreenCanvas.width = BOARD_W; offscreenCanvas.height = BOARD_H;
      offscreenCtx.clearRect(0, 0, BOARD_W, BOARD_H);
      offscreenCtx.drawImage(img, 0, 0, BOARD_W, BOARD_H);

      initPieces();
    }

    function buildPiecePath(targetCtx, x, y, top, right, bottom, left) {
      targetCtx.beginPath();
      targetCtx.moveTo(x, y);
      drawJigsawEdge(targetCtx, x, y, x + PIECE_W, y, top);
      drawJigsawEdge(targetCtx, x + PIECE_W, y, x + PIECE_W, y + PIECE_H, right);
      drawJigsawEdge(targetCtx, x + PIECE_W, y + PIECE_H, x, y + PIECE_H, bottom);
      drawJigsawEdge(targetCtx, x, y + PIECE_H, x, y, left);
      targetCtx.closePath();
    }

    function drawJigsawEdge(targetCtx, x1, y1, x2, y2, type) {
      if (type === 0) { targetCtx.lineTo(x2, y2); return; }
      const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy);
      const nx = -dy / len * type, ny = dx / len * type;
      const tx = dx / len, ty = dy / len;
      const p1x = x1 + tx * len * 0.38, p1y = y1 + ty * len * 0.38;
      const p2x = x1 + tx * len * 0.62, p2y = y1 + ty * len * 0.62;
      const cx = x1 + tx * len * 0.5 + nx * len * 0.22, cy = y1 + ty * len * 0.5 + ny * len * 0.22;

      targetCtx.lineTo(p1x, p1y);
      targetCtx.bezierCurveTo(p1x + nx * len * 0.1, p1y + ny * len * 0.1, cx - tx * len * 0.15 + nx * len * 0.05, cy - ty * len * 0.15 - ny * len * 0.05, cx, cy);
      targetCtx.bezierCurveTo(cx + tx * len * 0.15 + nx * len * 0.05, cy + ty * len * 0.15 - ny * len * 0.05, p2x + nx * len * 0.1, p2y + ny * len * 0.1, p2x, p2y);
      targetCtx.lineTo(x2, y2);
    }

    function initPieces() {
      pieces = [];
      let index = 0, startScatterY = BOARD_Y + BOARD_H + 15;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          let top = (r === 0) ? 0 : -edgesVertical[r - 1][c];
          let bottom = (r === ROWS - 1) ? 0 : edgesVertical[r][c];
          let left = (c === 0) ? 0 : -edgesHorizontal[r][c - 1];
          let right = (c === COLS - 1) ? 0 : edgesHorizontal[r][c];

          let targetX = BOARD_X + c * PIECE_W, targetY = BOARD_Y + r * PIECE_H;
          let scatterColWidth = CANVAS_WIDTH / COLS;
          let randomX = (index % COLS) * scatterColWidth + 5;
          let randomY = startScatterY + Math.floor(index / COLS) * (PIECE_H * 0.75);

          pieces.push({
            id: index, col: c, row: r, top: top, right: right, bottom: bottom, left: left,
            targetX: targetX, targetY: targetY, x: randomX, y: randomY, isSnapped: false
          });
          index++;
        }
      }
      drawCanvas();
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(BOARD_X, BOARD_Y, BOARD_W, BOARD_H);
      ctx.setLineDash([]);

      pieces.filter(p => p.isSnapped).forEach(p => drawPiece(p));
      pieces.filter(p => !p.isSnapped && p !== selectedPiece).forEach(p => drawPiece(p));
      if (selectedPiece) drawPiece(selectedPiece, true);
    }

    function drawPiece(p, isDragging = false) {
      ctx.save();
      buildPiecePath(ctx, p.x, p.y, p.top, p.right, p.bottom, p.left);
      if (isDragging) {
        ctx.shadowColor = 'rgba(255, 0, 85, 0.8)';
        ctx.shadowBlur = 12;
      }
      ctx.clip();
      ctx.drawImage(offscreenCanvas, p.x - p.col * PIECE_W, p.y - p.row * PIECE_H, BOARD_W, BOARD_H);
      ctx.restore();

      ctx.save();
      buildPiecePath(ctx, p.x, p.y, p.top, p.right, p.bottom, p.left);
      ctx.lineWidth = p.isSnapped ? 1.5 : 2;
      ctx.strokeStyle = p.isSnapped ? '#10b981' : '#ff0055';
      ctx.stroke();
      ctx.restore();
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      for (let i = pieces.length - 1; i >= 0; i--) {
        let p = pieces[i];
        if (p.isSnapped) continue;
        if (pos.x >= p.x - 10 && pos.x <= p.x + PIECE_W + 10 && pos.y >= p.y - 10 && pos.y <= p.y + PIECE_H + 10) {
          selectedPiece = p;
          dragOffsetX = pos.x - p.x; dragOffsetY = pos.y - p.y;
          drawCanvas();
          break;
        }
      }
    }

    function onPointerMove(e) {
      if (!selectedPiece) return;
      e.preventDefault();
      const pos = getPointerPos(e);
      selectedPiece.x = pos.x - dragOffsetX;
      selectedPiece.y = pos.y - dragOffsetY;
      drawCanvas();
    }

    function onPointerUp() {
      if (!selectedPiece) return;
      let dist = Math.hypot(selectedPiece.x - selectedPiece.targetX, selectedPiece.y - selectedPiece.targetY);
      if (dist < 25) {
        selectedPiece.x = selectedPiece.targetX;
        selectedPiece.y = selectedPiece.targetY;
        selectedPiece.isSnapped = true;
      }
      selectedPiece = null;
      drawCanvas();
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    /* LOGIKA MATH GAME */
    const TOTAL_QUESTIONS = 10, TIME_PER_QUESTION = 10;
    const QUOTES = ["“Pertahankan fokusmu, hasil yang baik butuh latihan!”", "“Kecepatan dan ketepatan adalah kuncinya!”"];

    let questions = [], currentQuestionIndex = 0, userAnswers = [], timer = null, timeLeft = TIME_PER_QUESTION;

    const welcomeScreen = document.getElementById('welcome-screen');
    const tableScreen = document.getElementById('table-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionDisplay = document.getElementById('question-display');
    const userInput = document.getElementById('user-input');
    const progressText = document.getElementById('progress-text');
    const timerText = document.getElementById('timer-text');
    const timerBar = document.getElementById('timer-bar');

    function showScreen(screen) {
      [welcomeScreen, tableScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function goToHome() { showScreen(welcomeScreen); }
    function goToTablePage() { showScreen(tableScreen); }

    function onOpChange() {
      renderMathTable();
    }

    function toggleModeUI() {
      const mode = document.getElementById('mode-select').value;
      document.getElementById('single-mode-ui').style.display = (mode === 'single') ? 'block' : 'none';
      document.getElementById('random-mode-ui').style.display = (mode !== 'single') ? 'block' : 'none';
      document.getElementById('op-select').style.display = (mode === 'complex') ? 'none' : 'block';
      document.getElementById('op-label').style.display = (mode === 'complex') ? 'none' : 'block';
      document.getElementById('table-card-container').style.display = (mode === 'complex') ? 'none' : 'block';
    }

    function renderMathTable() {
      const op = document.getElementById('op-select').value;
      const table = document.getElementById('math-table');
      let symbol = op === 'division' ? '÷' : '×';
      let html = `<thead><tr><th>${symbol}</th>`;
      for (let col = 1; col <= 10; col++) html += `<th>${col}</th>`;
      html += '</tr></thead><tbody>';

      for (let row = 1; row <= 10; row++) {
        html += `<tr><td style="font-weight:bold">${row}</td>`;
        for (let col = 1; col <= 10; col++) {
          let val = op === 'division' ? (row * col) + '÷' + col : row * col;
          html += `<td>${val}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody>';
      table.innerHTML = html;
    }

    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateQuestions() {
      questions = [];
      const op = document.getElementById('op-select').value;
      const mode = document.getElementById('mode-select').value;
      let minNum = parseInt(document.getElementById('min-num').value, 10) || 1;
      let maxNum = parseInt(document.getElementById('max-num').value, 10) || 10;
      if (minNum > maxNum) [minNum, maxNum] = [maxNum, minNum];

      if (mode === 'complex') {
        const ops = ['+', '-', '×'];
        for (let i = 0; i < TOTAL_QUESTIONS; i++) {
          let a = getRandomInt(minNum, maxNum), b = getRandomInt(minNum, maxNum), c = getRandomInt(0, 9);
          let op1 = ops[getRandomInt(0, ops.length - 1)], op2 = ops[getRandomInt(0, ops.length - 1)];
          let text = `${a} ${op1} ${b} ${op2} ${c}`, answer;

          if (op1 === '×' && op2 !== '×') answer = (op2 === '+') ? (a * b) + c : (a * b) - c;
          else if (op2 === '×' && op1 !== '×') answer = (op1 === '+') ? a + (b * c) : a - (b * c);
          else if (op1 === '×' && op2 === '×') answer = a * b * c;
          else answer = (op1 === '+') ? ((op2 === '+') ? a + b + c : a + b - c) : ((op2 === '+') ? a - b + c : a - b - c);

          questions.push({ text: text, answer: answer });
        }
        return;
      }

      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        let n1 = getRandomInt(minNum, maxNum), n2 = getRandomInt(1, 10);
        if (op === 'multiplication') {
          questions.push({ text: `${n1} × ${n2}`, answer: n1 * n2 });
        } else {
          let dividend = n1 * n2;
          questions.push({ text: `${dividend} ÷ ${n1}`, answer: n2 });
        }
      }
    }

    function startQuiz() {
      generateQuestions();
      currentQuestionIndex = 0; userAnswers = [];
      showScreen(quizScreen);
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= TOTAL_QUESTIONS) { showResults(); return; }
      const q = questions[currentQuestionIndex];
      questionDisplay.textContent = q.text;
      progressText.textContent = `Soal ${currentQuestionIndex + 1}/${TOTAL_QUESTIONS}`;
      userInput.value = ''; userInput.focus();
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timer);
      timeLeft = TIME_PER_QUESTION;
      updateTimerUI();
      timer = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { clearInterval(timer); recordAnswer(null); } 
        else { updateTimerUI(); }
      }, 100);
    }

    function updateTimerUI() {
      timerBar.style.width = `${Math.max(0, (timeLeft / TIME_PER_QUESTION) * 100)}%`;
      timerText.textContent = `⏱️ ${Math.ceil(timeLeft)}s`;
    }

    function submitAnswer(e) {
      e.preventDefault();
      clearInterval(timer);
      const val = userInput.value.trim();
      recordAnswer(val === '' ? null : parseInt(val, 10));
    }

    function recordAnswer(ans) {
      const q = questions[currentQuestionIndex];
      userAnswers.push({ question: q.text, correctAnswer: q.answer, userAnswer: ans, isCorrect: ans === q.answer });
      currentQuestionIndex++;
      loadQuestion();
    }

    function showResults() {
      showScreen(resultScreen);
      let correctCount = userAnswers.filter(a => a.isCorrect).length;
      document.getElementById('score-display').textContent = `${correctCount}/${TOTAL_QUESTIONS}`;

      const container = document.getElementById('analysis-container');
      container.innerHTML = '';
      userAnswers.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `analysis-item ${item.isCorrect ? 'correct' : 'wrong'}`;
        let userText = item.userAnswer === null ? 'Waktu Habis' : item.userAnswer;
        div.innerHTML = `<div><strong>${index + 1}. ${item.question}</strong><br><small>Jawaban: ${userText} (Benar: ${item.correctAnswer})</small></div>`;
        container.appendChild(div);
      });
    }

    window.onload = function() {
      createDefaultImage();
      renderMathTable();
      toggleModeUI();
    };
  </script>
</body>
</html>
